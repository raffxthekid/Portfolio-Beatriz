name: mobile-overflow

# The status check exposed to branch protection rules is named
# "Verify no 375px overflow" (the value of jobs.test.name below).
# This name is deterministic — independent of the workflow filename,
# branch, or matrix expansion — because:
#   - the workflow `name:` is a stable slug (no expressions, no matrix)
#   - the job `name:` is a fixed string (no `${{ matrix.* }}` interpolation)
#   - we publish an additional commit status with the same name from the
#     final step, so the context appears even on skipped/forked runs
#
# To require it on a branch:
#   Settings → Branches → Branch protection rules →
#     Require status checks → search "Verify no 375px overflow".

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  merge_group:

# Cancel superseded runs on the same ref to keep the check status fresh.
concurrency:
  group: mobile-overflow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write  # needed to publish the mirrored commit status

jobs:
  test:
    # IMPORTANT: do not change this name — branch protection rules match on it.
    name: Verify no 375px overflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run mobile overflow test
        id: overflow_test
        run: |
          set -o pipefail
          bunx vitest run src/components/site/__tests__/mobile-overflow.test.ts 2>&1 | tee /tmp/overflow-report.txt

      - name: Publish failure report to job summary
        if: failure() && steps.overflow_test.outcome == 'failure'
        run: |
          {
            echo "## ❌ Mobile overflow guard failed"
            echo ""
            echo "One or more components in \`src/components/site/\` introduce an element wider than 375px."
            echo ""
            echo "<details><summary>Test output</summary>"
            echo ""
            echo '```'
            cat /tmp/overflow-report.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "**How to fix:** open the offending file at the line shown, replace the fixed width with a fluid one (\`w-full\`, percentage, \`max-w-*\`), or — if the element is decorative and clipped by an \`overflow-hidden\` parent — add \`// allow-mobile-overflow\` on the same line."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: failure() && steps.overflow_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-overflow-report
          path: /tmp/overflow-report.txt
          retention-days: 14

      # Mirror the result onto the commit as a status with a fixed context.
      # On failure, link directly to this job's summary (which contains the
      # rendered report). On success, link to the run page.
      - name: Publish deterministic status check
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ steps.overflow_test.outcome == 'success' && 'success' || 'failure' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATE" = "success" ]; then
            DESCRIPTION="No element exceeds the 375px mobile viewport."
            TARGET_URL="$RUN_URL"
          else
            DESCRIPTION="Overflow detected — open the report for details."
            # Deep link to the run's Summary tab, which renders the failure report.
            TARGET_URL="$RUN_URL#summary"
          fi

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{
              \"state\": \"$STATE\",
              \"context\": \"Verify no 375px overflow\",
              \"description\": \"$DESCRIPTION\",
              \"target_url\": \"$TARGET_URL\"
            }"

